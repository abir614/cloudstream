[package]
name = "cloudstream-core"
version = "0.1.0"
edition = "2021"
authors = ["CloudStream Contributors"]
description = "High-performance, memory-efficient, sandboxed Rust core for CloudStream"

[lib]
name = "cloudstream_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Embedded WebAssembly runtime with fuel limiting (optional feature-gated)
wasmi = { version = "0.36.0", optional = true }

# URL parsing & Anti-SSRF validation
url = "2.5.4"
ipnet = "2.10.1"

# Serialization & Zero-copy parsing
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
memchr = "2.7.4"

# Cryptography & Zero-Trust Identity Verification
sha2 = "0.10.8"
hmac = "0.12.1"
getrandom = "0.2.15"
hex = "0.4.3"

# Error handling
thiserror = "2.0.11"

# Modern Cryptography: Offline Ed25519 update verification & Encrypted backup
ed25519-dalek = { version = "2.1", default-features = false }
chacha20poly1305 = "0.11"
argon2 = "0.5"

# Android JNI integration (optional feature)
jni = { version = "0.21.1", default-features = false }
miniz_oxide = "0.9.1"

[dev-dependencies]
# Testing & Fuzz testing
quickcheck = "1.0.3"
quickcheck_macros = "1.0.3"
tempfile = "3.16.0"

[features]
default = ["wasm-sandbox"]
wasm-sandbox = ["dep:wasmi"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

