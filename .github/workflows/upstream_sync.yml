name: Daily Upstream Sync & Hardened Build

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: "upstream-sync"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-upstream:
    name: Check & Sync Upstream CloudStream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check Upstream Updates
        id: check_upstream
        run: |
          git remote add upstream https://github.com/recloudstream/cloudstream.git || true
          git fetch upstream master --tags
          
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          echo "Latest upstream master: ${UPSTREAM_HEAD}"
          
          # Check latest upstream release tag
          UPSTREAM_TAG=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+' | head -n 1)
          echo "Latest tag: ${UPSTREAM_TAG}"
          echo "upstream_tag=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          
          # Check if upstream has new commits since last recorded sync
          LAST_SYNC_FILE=".github/upstream_sync_state"
          LAST_SYNC=""
          if [ -f "$LAST_SYNC_FILE" ]; then
            LAST_SYNC=$(cat "$LAST_SYNC_FILE" | tr -d '[:space:]')
          fi
          
          if [ "$LAST_SYNC" = "$UPSTREAM_HEAD" ]; then
            echo "Already up-to-date with upstream ${UPSTREAM_HEAD}"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "New updates detected in upstream (${UPSTREAM_HEAD})"
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "upstream_head=${UPSTREAM_HEAD}" >> $GITHUB_OUTPUT
          fi

      - name: Apply Upstream & Preserve Hardening Overlay
        if: steps.check_upstream.outputs.has_updates == 'true'
        id: apply_sync
        run: |
          UPSTREAM_HEAD="${{ steps.check_upstream.outputs.upstream_head }}"
          
          # Create a backup of our hardening & core modules
          mkdir -p /tmp/hardened_backup
          cp -r rust-core /tmp/hardened_backup/
          cp -r keystore /tmp/hardened_backup/
          cp -r .github/workflows /tmp/hardened_backup/
          cp app/src/main/java/com/lagradost/cloudstream3/services/NativeCoreBridge.kt /tmp/hardened_backup/
          cp app/src/main/java/com/lagradost/cloudstream3/services/ExtensionSandboxService.kt /tmp/hardened_backup/
          cp app/src/main/java/com/lagradost/cloudstream3/utils/UpdateSecurityGate.kt /tmp/hardened_backup/
          cp app/src/main/java/com/lagradost/cloudstream3/utils/InAppUpdater.kt /tmp/hardened_backup/
          
          # Merge upstream changes allowing unrelated histories if needed
          git merge --no-edit -X ours --allow-unrelated-histories upstream/master || true
          
          # Restore and enforce our hardened security and optimization layers
          cp -r /tmp/hardened_backup/rust-core .
          cp -r /tmp/hardened_backup/keystore .
          cp -r /tmp/hardened_backup/workflows/* .github/workflows/
          cp /tmp/hardened_backup/NativeCoreBridge.kt app/src/main/java/com/lagradost/cloudstream3/services/
          cp /tmp/hardened_backup/ExtensionSandboxService.kt app/src/main/java/com/lagradost/cloudstream3/services/
          cp /tmp/hardened_backup/UpdateSecurityGate.kt app/src/main/java/com/lagradost/cloudstream3/utils/
          cp /tmp/hardened_backup/InAppUpdater.kt app/src/main/java/com/lagradost/cloudstream3/utils/
          
          # Clean desktop leftovers if upstream re-introduced them
          rm -rf desktopApp library/src/webMain library/src/webTest
          sed -i 's/, ":desktopApp"//g' settings.gradle.kts
          
          # Record sync state
          echo "$UPSTREAM_HEAD" > .github/upstream_sync_state
          
          git add -A
          git commit -m "chore(sync): sync upstream updates (${UPSTREAM_HEAD:0:8}) with hardened security overlay" || true
          git push origin master
          echo "Successfully synced and pushed upstream updates to master."
