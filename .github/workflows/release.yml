name: Stable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v4.8.0-hardened or v1.0.0)'
        required: true
        default: 'v4.8.0-hardened'
      release_name:
        description: 'Release Title'
        required: true
        default: 'CloudStream (Hardened & Optimized Edition)'
      body:
        description: 'Release description / changelog'
        required: false
        default: 'Official Stable Release featuring Z+ zero-trust sandbox isolation, native Rust core, SIMD M3U streaming, and anti-SSRF protections.'

concurrency:
  group: "stable-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        id: fetch_keystore
        run: |
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
          mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
          if [ -f "keystore/release.keystore" ]; then
            echo "Using permanent repository release keystore (deterministic signing)..."
            cp "keystore/release.keystore" "${TMP_KEYSTORE_FILE_PATH}/prerelease_keystore.keystore"
            echo "key_pwd=android" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using persistent release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/prerelease_keystore.keystore"
            echo "key_pwd=${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_OUTPUT
          else
            echo "Using default repo keystore..."
            echo "key_pwd=android" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Build Rust Native Core for ARMv7 and ARMv8
        run: |
          cargo install cargo-ndk --locked
          cd rust-core
          cargo ndk -t armeabi-v7a -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Run Gradle (Assemble Stable Release)
        run: ./gradlew assembleStableRelease androidSourcesJar makeJar
        env:
          SIGNING_KEY_ALIAS: "key0"
          SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Determine Tag & Name
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
            echo "body=${{ inputs.body }}" >> $GITHUB_OUTPUT
          else
            TAG_REF="${{ github.ref_name }}"
            echo "tag=${TAG_REF}" >> $GITHUB_OUTPUT
            echo "title=CloudStream Hardened Edition ${TAG_REF}" >> $GITHUB_OUTPUT
            echo "body=Official Stable Release ${TAG_REF}" >> $GITHUB_OUTPUT
          fi

      - name: Create Stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.body }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/stable/release/*.apk
            app/build/libs/app-sources.jar
            app/build/classes.jar
