name: Stable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (leave empty for automatic detection)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (leave empty for automatic detection)'
        required: false
        default: ''
      body:
        description: 'Release description / changelog'
        required: false
        default: ''

concurrency:
  group: "stable-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Stable Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        id: fetch_keystore
        run: |
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
          mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.CS_KEYSTORE_B64 }}" ]; then
            echo "Using secure release keystore from CI secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.CS_KEYSTORE_B64 }}" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
            echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
            echo "key_pwd=${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.CS_KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_OUTPUT
          elif [ -f "keystore/release.keystore" ]; then
            echo "Using repository release keystore (deterministic signing)..."
            cp "keystore/release.keystore" "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
            echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
            echo "key_pwd=android" >> $GITHUB_OUTPUT
          else
            echo "Generating deterministic release keystore..."
            keytool -genkeypair -v -keystore "${TMP_KEYSTORE_FILE_PATH}/release.keystore" \
              -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CloudStream, OU=abir614, O=CloudStream, C=US"
            echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
            echo "key_pwd=android" >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Rust & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Build Rust Native Core for ARM and x86 Architectures
        run: |
          cargo install cargo-ndk --locked
          cd rust-core
          cargo ndk -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Determine Tag & Name
        id: release_meta
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_BODY: ${{ inputs.body }}
        run: |
          COUNT=$(git rev-list --count HEAD)
          TAG="${INPUT_TAG_NAME}"
          [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE}" = "tag" ] && TAG="${GITHUB_REF_NAME}"
          [ -z "$TAG" ] && TAG="v${COUNT}"

          TITLE="${INPUT_RELEASE_NAME}"
          [ -z "$TITLE" ] && TITLE="CloudStream Hardened Edition ${TAG}"

          BODY="${INPUT_BODY}"
          [ -z "$BODY" ] && BODY="Official Stable Release ${TAG} featuring Z+ zero-trust sandbox isolation, native Rust core, and cryptographic update verification."

          DELIMITER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "body<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "${BODY}" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Run Gradle (Assemble Stable Release)
        run: ./gradlew assembleStableRelease androidSourcesJar makeJar
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          APP_VERSION_NAME: ${{ steps.release_meta.outputs.tag }}
          CS_KEYSTORE_PATH: ${{ steps.fetch_keystore.outputs.keystore_path }}
          CS_KEYSTORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          CS_KEY_ALIAS: "key0"
          CS_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          SIGNING_KEY_ALIAS: "key0"
          SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Tag Release Files with Version Tag
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          cd app/build/outputs/apk/stable/release/
          for apk in *.apk; do
            if [ -f "$apk" ]; then
              abi=$(echo "$apk" | sed -E 's/app-stable-(.*)-release\.apk/\1/')
              tagged="CloudStream-${TAG}-${abi}.apk"
              cp "$apk" "$tagged"
            fi
          done
          sha256sum *.apk > SHA256SUMS
          cd ../../../../../
          if [ -f "app/build/libs/app-sources.jar" ]; then
            cp "app/build/libs/app-sources.jar" "app/build/libs/app-sources-${TAG}.jar"
          fi
          if [ -f "app/build/classes.jar" ]; then
            cp "app/build/classes.jar" "app/build/classes-${TAG}.jar"
          fi

      - name: Create Stable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.title }}
          body: ${{ steps.release_meta.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/stable/release/*.apk
            app/build/outputs/apk/stable/release/SHA256SUMS*
            app/build/libs/*.jar
            app/build/classes*.jar
