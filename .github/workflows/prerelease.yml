name: Pre-release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore
      id: fetch_keystore
      run: |
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.CS_KEYSTORE_B64 }}" ]; then
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
          mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
          echo "Using secure release keystore from CI secrets..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.CS_KEYSTORE_B64 }}" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
          echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
          echo "key_pwd=${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.CS_KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
        else
          echo "No keystore secret provided. Build will remain unsigned."
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Set up Rust & Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

    - name: Build Rust Native Core for ARM and x86 Architectures
      run: |
        cargo install cargo-ndk --locked
        cd rust-core
        cargo ndk -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease androidSourcesJar makeJar
      env:
        CS_KEYSTORE_PATH: ${{ steps.fetch_keystore.outputs.keystore_path }}
        CS_KEYSTORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        CS_KEY_ALIAS: "key0"
        CS_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_KEY_ALIAS: "key0"
        SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Generate SHA256SUMS Checksums
      run: |
        cd app/build/outputs/apk/prerelease/release/
        sha256sum *.apk > SHA256SUMS

    - name: Compute Build Count
      id: build_count
      run: |
        COUNT=$(git rev-list --count HEAD)
        echo "count=${COUNT}" >> $GITHUB_OUTPUT

    - name: Create pre-release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "pre-release"
        prerelease: true
        title: "Pre-release Build #${{ steps.build_count.outputs.count }}"
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/outputs/apk/prerelease/release/SHA256SUMS
          app/build/libs/app-sources.jar
          app/build/classes.jar
