name: Pre-release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore
      id: fetch_keystore
      run: |
        TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
        mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
        if [ -f "keystore/release.keystore" ]; then
          echo "Using permanent repository release keystore (deterministic signing)..."
          cp "keystore/release.keystore" "${TMP_KEYSTORE_FILE_PATH}/prerelease_keystore.keystore"
          echo "key_pwd=android" >> $GITHUB_OUTPUT
        elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "Using persistent release keystore from secrets..."
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/prerelease_keystore.keystore"
          echo "key_pwd=${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_OUTPUT
        else
          echo "Using default repo keystore..."
          echo "key_pwd=android" >> $GITHUB_OUTPUT
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Set up Rust & Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi

    - name: Build Rust Native Core for ARMv7 and ARMv8
      run: |
        cargo install cargo-ndk --locked
        cd rust-core
        cargo ndk -t armeabi-v7a -t arm64-v8a -o ../app/src/main/jniLibs build --release

    - name: Run Gradle (Assemble Android Release)
      run: ./gradlew assemblePrereleaseRelease androidSourcesJar makeJar
      env:
        SIGNING_KEY_ALIAS: "key0"
        SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release-artifacts
        path: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/libs/app-sources.jar
          app/build/classes.jar

  build-linux:
    name: Build Linux Desktop (AppImage & Portable)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install Linux packaging tools & appimagetool
      run: |
        sudo apt-get update && sudo apt-get install -y libfuse2 file fakeroot
        mkdir -p /tmp/tools
        wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/tools/appimagetool
        chmod +x /tmp/tools/appimagetool
        echo "/tmp/tools" >> $GITHUB_PATH
        echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Native Core for Linux x86_64
      run: |
        cd rust-core
        cargo build --release
        mkdir -p ../desktopApp/build/nativeLibs
        cp target/release/libcloudstream_core.so ../desktopApp/build/nativeLibs/

    - name: Build Linux Desktop Packages
      run: ./gradlew :desktopApp:packageAppImage :desktopApp:packageDeb :desktopApp:createDistributable || ./gradlew :desktopApp:createDistributable

    - name: Assemble Linux AppImage and Portable Archive
      run: |
        mkdir -p /tmp/linux-dist
        find desktopApp/build/compose/binaries -name "*.AppImage" -exec cp {} /tmp/linux-dist/CloudStream-linux-x86_64.AppImage \; || true
        find desktopApp/build/compose/binaries -name "*.deb" -exec cp {} /tmp/linux-dist/CloudStream-linux-x86_64.deb \; || true
        
        # Fallback generate AppImage if not generated directly by Gradle
        if [ ! -f /tmp/linux-dist/CloudStream-linux-x86_64.AppImage ]; then
          echo "Packaging standalone AppImage from distributable..."
          APP_DIR=$(find desktopApp/build/compose/binaries -type d -name "CloudStream" | head -n 1)
          if [ -d "$APP_DIR" ]; then
            mkdir -p /tmp/AppDir/usr/bin /tmp/AppDir/usr/share/icons/hicolor/256x256/apps
            cp -r "$APP_DIR"/* /tmp/AppDir/usr/bin/
            cp desktopApp/src/desktop-icons/icon-linux.png /tmp/AppDir/usr/share/icons/hicolor/256x256/apps/cloudstream.png
            cp desktopApp/src/desktop-icons/icon-linux.png /tmp/AppDir/cloudstream.png
            cat << 'EOF' > /tmp/AppDir/cloudstream.desktop
[Desktop Entry]
Type=Application
Name=CloudStream
Exec=CloudStream
Icon=cloudstream
Categories=AudioVideo;Video;Player;
EOF
            cat << 'EOF' > /tmp/AppDir/AppRun
#!/bin/sh
HERE="$(dirname "$(readlink -f "${0}")")"
exec "${HERE}/usr/bin/CloudStream" "$@"
EOF
            chmod +x /tmp/AppDir/AppRun
            appimagetool /tmp/AppDir /tmp/linux-dist/CloudStream-linux-x86_64.AppImage
          fi
        fi

        # Create portable tar.gz
        APP_DIR=$(find desktopApp/build/compose/binaries -type d -name "CloudStream" | head -n 1)
        if [ -d "$APP_DIR" ]; then
          PARENT_DIR=$(dirname "$APP_DIR")
          tar -czf /tmp/linux-dist/CloudStream-linux-x86_64-portable.tar.gz -C "$PARENT_DIR" CloudStream
        fi

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-release-artifacts
        path: /tmp/linux-dist/*

  build-windows:
    name: Build Windows Desktop (Live Executable & Setup)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Rust Native Core for Windows x86_64
      run: |
        cd rust-core
        cargo build --release
        mkdir -p ../desktopApp/build/nativeLibs
        cp target/release/cloudstream_core.dll ../desktopApp/build/nativeLibs/
      shell: bash

    - name: Build Windows Desktop Packages
      run: ./gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable || ./gradlew.bat :desktopApp:createDistributable

    - name: Assemble Windows Live Executable Archive
      shell: bash
      run: |
        mkdir -p /tmp/windows-dist
        find desktopApp/build/compose/binaries -name "*.exe" -exec cp {} /tmp/windows-dist/CloudStream-windows-x64-Setup.exe \; || true
        find desktopApp/build/compose/binaries -name "*.msi" -exec cp {} /tmp/windows-dist/CloudStream-windows-x64.msi \; || true
        
        # Package standalone live executable folder with CloudStream.exe
        APP_DIR=$(find desktopApp/build/compose/binaries -type d -name "CloudStream" | head -n 1)
        if [ -d "$APP_DIR" ]; then
          PARENT_DIR=$(dirname "$APP_DIR")
          cd "$PARENT_DIR"
          7z a /tmp/windows-dist/CloudStream-windows-x64-portable.zip CloudStream
        fi

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-artifacts
        path: /tmp/windows-dist/*

  publish-prerelease:
    name: Publish Multi-Platform Pre-release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        path: /tmp/all-artifacts

    - name: Consolidate Artifacts
      run: |
        mkdir -p /tmp/release-files
        find /tmp/all-artifacts -type f -exec cp {} /tmp/release-files/ \;
        echo "=== Release Files Ready for Publishing ==="
        ls -lh /tmp/release-files/

    - name: Create Multi-Platform Pre-release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "pre-release"
        prerelease: true
        title: "Pre-release Multi-Platform Build (Android, Linux & Windows)"
        files: /tmp/release-files/*
