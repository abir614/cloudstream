name: Pre-release

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystore
      id: fetch_keystore
      env:
        B64_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.CS_KEYSTORE_B64 }}
        KEYSTORE_PWD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.CS_KEYSTORE_PASSWORD || 'android' }}
      run: |
        TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
        mkdir -p "${TMP_KEYSTORE_FILE_PATH}"
        if [ -n "$B64_KEYSTORE" ]; then
          echo "Using secure release keystore from CI secrets..."
          echo "$B64_KEYSTORE" | base64 -d > "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
          echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
          echo "key_pwd=${KEYSTORE_PWD}" >> $GITHUB_OUTPUT
        elif [ -f "keystore/release.keystore" ]; then
          echo "Using repository release keystore (deterministic signing)..."
          cp "keystore/release.keystore" "${TMP_KEYSTORE_FILE_PATH}/release.keystore"
          echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
          echo "key_pwd=android" >> $GITHUB_OUTPUT
        else
          echo "Generating deterministic release keystore..."
          keytool -genkeypair -v -keystore "${TMP_KEYSTORE_FILE_PATH}/release.keystore" \
            -alias key0 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CloudStream, OU=abir614, O=CloudStream, C=US"
          echo "keystore_path=${TMP_KEYSTORE_FILE_PATH}/release.keystore" >> $GITHUB_OUTPUT
          echo "key_pwd=android" >> $GITHUB_OUTPUT
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Set up Rust & Android targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

    - name: Build Rust Native Core for ARM and x86 Architectures
      run: |
        export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
        cargo install cargo-ndk --locked
        cd rust-core
        cargo ndk -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release
        find ../app/src/main/jniLibs -name "*.so" -exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded {} +

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease androidSourcesJar makeJar
      env:
        CS_KEYSTORE_PATH: ${{ steps.fetch_keystore.outputs.keystore_path }}
        CS_KEYSTORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        CS_KEY_ALIAS: "key0"
        CS_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_KEY_ALIAS: "key0"
        SIGNING_KEY_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIGNING_STORE_PASSWORD: ${{ steps.fetch_keystore.outputs.key_pwd }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Compute Build Count
      id: build_count
      run: |
        COUNT=$(git rev-list --count HEAD)
        echo "count=${COUNT}" >> $GITHUB_OUTPUT

    - name: Tag Release Files with Version Tag
      run: |
        COUNT="${{ steps.build_count.outputs.count }}"
        TAG="v${COUNT}"
        cd app/build/outputs/apk/prerelease/release/
        for apk in app-prerelease-*.apk; do
          if [ -f "$apk" ]; then
            abi=$(echo "$apk" | sed -E 's/app-prerelease-(.*)-release\.apk/\1/')
            tagged="CSB-prerelease-${TAG}-${abi}.apk"
            mv "$apk" "$tagged"
          fi
        done
        sha256sum *.apk > SHA256SUMS
        python3 -c "
          import glob, json, os, datetime
          tag = 'pre-release'
          build_tag = '${TAG}'
          commit_sha = '${{ github.sha }}'
          repo = '${{ github.repository }}'
          assets = []
          for apk in sorted(glob.glob('*.apk')):
              assets.append({
                  'name': apk,
                  'size': os.path.getsize(apk),
                  'browser_download_url': f'https://github.com/{repo}/releases/download/{tag}/{apk}',
                  'content_type': 'application/vnd.android.package-archive',
              })
          for extra in sorted(glob.glob('SHA256SUMS*')):
              assets.append({
                  'name': extra,
                  'size': os.path.getsize(extra),
                  'browser_download_url': f'https://github.com/{repo}/releases/download/{tag}/{extra}',
                  'content_type': 'text/plain',
              })
          manifest = {
              'tag_name': build_tag,
              'name': f'Pre-release Build #${{ steps.build_count.outputs.count }}',
              'body': f'Automated pre-release build for commit {commit_sha[:7]}',
              'target_commitish': commit_sha,
              'prerelease': True,
              'node_id': f'release_{build_tag}_{commit_sha[:7]}',
              'created_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'assets': assets
          }
          with open('release.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print('Successfully generated rate-limit-free release.json manifest with', len(assets), 'assets')
        "
        if [ -n "${{ secrets.ED25519_PRIVATE_KEY }}" ]; then
          python3 -c "
            import os
            try:
                from cryptography.hazmat.primitives.asymmetric import ed25519
                priv_hex = '${{ secrets.ED25519_PRIVATE_KEY }}'.strip()
                if priv_hex:
                    priv_bytes = bytes.fromhex(priv_hex)
                    key = ed25519.Ed25519PrivateKey.from_private_bytes(priv_bytes)
                    with open('SHA256SUMS', 'rb') as f:
                        data = f.read()
                    sig = key.sign(data)
                    with open('SHA256SUMS.sig', 'w') as f:
                        f.write(sig.hex())
                    print('Successfully generated SHA256SUMS.sig manifest signature')
            except Exception as e:
                print('Ed25519 signing skipped or failed:', e)
          " || true
        fi
        cd "$GITHUB_WORKSPACE"
        if [ -f "app/build/classes.jar" ]; then
          mkdir -p app/build/libs
          cp "app/build/classes.jar" "app/build/libs/classes.jar"
        fi

    - name: Clean Existing Pre-release Assets & Update Tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Determine immediate previous pre-release SHA before moving the tag
        PREV_PRE_SHA=$(git rev-parse -q --verify "refs/tags/pre-release" 2>/dev/null || git ls-remote --tags origin pre-release 2>/dev/null | tail -n 1 | awk '{print $1}')
        if [ -z "$PREV_PRE_SHA" ] || ! git cat-file -e "${PREV_PRE_SHA}^{commit}" 2>/dev/null || [ "$PREV_PRE_SHA" = "${{ github.sha }}" ]; then
          PREV_PRE_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
        fi

        # Determine latest stable release tag
        LATEST_STABLE_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+$' | sort -V | tail -n 1)
        if [ -z "$LATEST_STABLE_TAG" ]; then
          LATEST_STABLE_TAG="v220"
        fi

        # Generate scoped, readable changelog for in-app updates and release notes
        echo "## ⚡ CloudStream Beta (CSB) Pre-release" > release_body.md
        echo "" >> release_body.md
        echo "### 🔄 Changes Since Immediate Previous Pre-release" >> release_body.md
        if [ -n "$PREV_PRE_SHA" ]; then
          PREV_SHORT=$(git rev-parse --short "$PREV_PRE_SHA" 2>/dev/null || echo "$PREV_PRE_SHA")
          CHANGES=$(git log --no-merges --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "${PREV_PRE_SHA}..HEAD")
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES" >> release_body.md
          else
            echo "- Incremental maintenance & stabilization updates." >> release_body.md
          fi
          echo "" >> release_body.md
          echo "[View pre-release diff (${PREV_SHORT}...${{ github.sha }})](https://github.com/${{ github.repository }}/compare/${PREV_PRE_SHA}...${{ github.sha }})" >> release_body.md
        else
          echo "- Latest pre-release build updates." >> release_body.md
        fi

        echo "" >> release_body.md
        echo "### 🏷️ Comparison with Latest Stable (${LATEST_STABLE_TAG})" >> release_body.md
        echo "- **Stable Release**: [${LATEST_STABLE_TAG}](https://github.com/${{ github.repository }}/releases/tag/${LATEST_STABLE_TAG})" >> release_body.md
        echo "- **Diff with Stable**: [Compare ${LATEST_STABLE_TAG}...this build](https://github.com/${{ github.repository }}/compare/${LATEST_STABLE_TAG}...${{ github.sha }})" >> release_body.md
        echo "" >> release_body.md

        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git tag -f pre-release ${{ github.sha }}
        git push origin -f pre-release || true

        # Clean old APK and checksum assets from pre-release so builds don't pile up
        RELEASE_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/pre-release" | grep -m1 '"id":' | awk -F: '{print $2}' | tr -d ' ,')
        if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
          echo "Found existing pre-release ID: $RELEASE_ID. Purging older assets..."
          ASSET_IDS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | grep '"id":' | awk -F: '{print $2}' | tr -d ' ,')
          for aid in $ASSET_IDS; do
            echo "Deleting asset $aid..."
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$aid" || true
          done
        fi

    - name: Create Pre-release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: "pre-release"
        target_commitish: ${{ github.sha }}
        name: "Pre-release Build #${{ steps.build_count.outputs.count }}"
        body_path: release_body.md
        prerelease: true
        generate_release_notes: false
        make_latest: false
        fail_on_unmatched_files: false
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/outputs/apk/prerelease/release/SHA256SUMS*
          app/build/outputs/apk/prerelease/release/release.json
          app/build/libs/classes.jar
          app/build/libs/app-sources.jar
