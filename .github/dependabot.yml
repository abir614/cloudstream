version: 2
updates:
  # Check for updates to GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Check for updates to the Rust Security Core dependencies
  - package-ecosystem: "cargo"
    directory: "/rust-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Check for updates to Gradle & Android dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
